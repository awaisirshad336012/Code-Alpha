{% extends "store/base.html" %}
{% block title %}Log in — Roast &amp; Ritual{% endblock %}
{% block content %}
    <div class="auth-form-wrap">
        <h1>Log in</h1>
        <form method="post" class="auth-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-field">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<p class="field-error">{{ field.errors|striptags }}</p>{% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Log in</button>
        </form>
        <p class="auth-switch">New here? <a href="{% url 'register' %}">Create an account</a></p>
    </div>
{% endblock %}
